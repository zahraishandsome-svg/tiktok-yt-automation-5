# TikTok to YouTube Channel Pairs

channels:
  - id: channel_7
    tiktok_username: "sidandlisten"
    youtube_channel_name: "Sydney"
    google_credentials_file: "credentials/channel_7_client_secret.json"
    oauth_token_file: "tokens/channel_7_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - sidandlisten
      - usa
      - viral
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: short_only
    slot_publish_times_utc:
      1: "15:00"   # PUBLIC at 8 PM PKT (UTC+5)
      2: "17:00"   # PUBLIC at 10 PM PKT (UTC+5)
